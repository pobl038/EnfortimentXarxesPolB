

<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-signin-client_id" content="476999617163-6krmqmgm0u7igb4c35tickqtkqf33pcn.apps.googleusercontent.com">
  <title>PT2.5 GOOGLE SING IN</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h1>Pagina preparada per afegir l'Oauth2</h1>
  <div id="g_id_onload"
       data-client_id="EL_TEU_ID.apps.googleusercontent.com"
       data-callback="onSignIn">
  </div>
  <div class="g_id_signin" data-type="standard"></div>
  <button id="boto-sortir" style="display:none;" onclick="signOut()">Desconnectar</button>
   <script>
    function onSignIn() {
      document.getElementById('boto-sortir').style.display = 'block';
      document.querySelector('.g_id_signin').style.display = 'none';
    }

    function signOut() {
      document.getElementById('boto-sortir').style.display = 'none';
      document.querySelector('.g_id_signin').style.display = 'block';
    }
  </script>
</body>
</html>
